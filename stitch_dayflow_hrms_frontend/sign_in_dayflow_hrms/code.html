<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dayflow HRMS - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-secondary-fixed-variant": "#444173",

                        "primary-fixed": "#e2dfff",

                        "primary-fixed-dim": "#c3c0ff",

                        "error": "#ba1a1a",

                        "surface-tint": "#4d44e3",
                        "tertiary-container": "#885500",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#ebf1ff",
                        "outline": "#777587",
                        "tertiary-fixed-dim": "#ffb95f",
                        "tertiary-fixed": "#ffddb8",
                        "surface-container": "#e7eefe",
                        "primary-container": "#4f46e5",
                        "on-secondary-container": "#514f81",
                        "on-tertiary-fixed": "#2a1700",
                        "on-background": "#151c27",
                        "inverse-primary": "#c3c0ff",
                        "primary": "#3525cd",
                        "surface-variant": "#dce2f3",
                        "surface-dim": "#d3daea",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f0f3ff",
                        "on-secondary-fixed": "#181445",
                        "surface-bright": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "1.5rem",
                        "xs": "0.25rem",
                        "base": "4px",
                        "xl": "2rem",
                        "sm": "0.5rem",
                        "margin-desktop": "2rem",
                        "margin-mobile": "1rem",
                        "md": "1rem",
                        "gutter": "1rem"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],

                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-[#181445] to-primary flex items-center justify-center p-4">
<!-- Canvas (Main Content) - Transactional Intent (Suppressed Navigation Shells) -->
<main class="w-full max-w-md bg-surface rounded-2xl shadow-lg border border-outline-variant overflow-hidden">
<div class="p-8">
<!-- Brand / Logo Area -->
<div class="flex flex-col items-center justify-center mb-8">
<div class="w-24 h-24 mb-4">
<img alt="Dayflow HRMS Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDanNyC9tNWCT0pfkLfsEYQlHdTUDnoPSZaihkoFYX4E6c5z9Rp8qpRsosHm54YPeW-xZQ2lQsxoYdD5c9J_YKi92KzZXmIbiD-H54m_ik3keVabgbXjQ-TFssmIZVQTfJOTx_osT22SFPTH0s-SJtlVtzCFVN7rxL9L2jPOELoOo2AWjdyeJxx7eojyvBfCZgXjxZprYlnbNRw185BYM3IeWnt1oPxNr_WgIXGMaCaCuqkuvkS_xPUxA"/>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary text-center tracking-tight mb-2 uppercase">Dayflow HRMS</h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center">Human Resource Management System</p>
</div>
<!-- Sign In Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Login ID / Email -->
<div>
<label class="block text-label-sm font-label-sm text-on-surface mb-xs" for="email">Login ID / Email</label>
<div class="relative rounded-lg shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 sm:text-body-md border-outline-variant rounded-lg focus:ring-primary focus:border-primary bg-surface-container-lowest text-on-surface" id="email" name="email" placeholder="Enter your ID or email" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block text-label-sm font-label-sm text-on-surface mb-xs" for="password">Password</label>
<div class="relative rounded-lg shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2 sm:text-body-md border-outline-variant rounded-lg focus:ring-primary focus:border-primary bg-surface-container-lowest text-on-surface" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" onclick="togglePasswordVisibility()">
<span class="material-symbols-outlined text-outline hover:text-on-surface transition-colors" id="password-toggle-icon">visibility</span>
</div>
</div>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-title-md font-title-md text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200 uppercase" type="submit">
                        Sign In
                    </button>
</div>
</form>
<!-- Sign Up Link -->
<div class="mt-8 text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                    Don't have an Account? 
                    <a class="font-medium text-primary hover:text-primary-container hover:underline transition-colors" href="#">Sign Up</a>
</p>
</div>
</div>
</main>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
